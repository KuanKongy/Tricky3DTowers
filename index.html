<!doctype html>
<html lang="en" class="dark" data-scene="night">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a0a3d" />
    <title>Tricky Towers 3D</title>
    <meta
      name="description"
      content="A physics-based tower-stacking game set in a stylized night-sky world. Built with Three.js, Rapier and React."
    />
    <meta property="og:title" content="Tricky Towers 3D" />
    <meta property="og:description" content="A physics-based tower-stacking game set in a stylized night-sky world." />
    <meta property="og:image" content="/Tricky3DTowers/og-image.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tricky Towers 3D" />
    <meta name="twitter:image" content="/Tricky3DTowers/og-image.png" />
    <style>
      html.dark { background-color: #06030f; }
      html:not(.dark) { background-color: #dbe7fb; }
      html:not(.dark)[data-scene="evening"] { background-color: #f3d9b8; }
    </style>
    <script>
      // Resolve the theme before first paint. Priority: ?theme= param >
      // saved toggle > OS preference (first visit). Must mirror stored.dark
      // and stored.sceneTime in src/store/gameStore.ts.
      (function () {
        try {
          var forced = new URLSearchParams(location.search).get("theme");
          var saved = localStorage.getItem("trickyTowers.dark");
          var dark = forced
            ? forced !== "light"
            : saved === null
              ? !matchMedia("(prefers-color-scheme: light)").matches
              : saved === "1";
          document.documentElement.classList.toggle("dark", dark);
          var st = localStorage.getItem("trickyTowers.sceneTime");
          var scene = dark ? "night" : st === "EVENING" ? "evening" : "day";
          document.documentElement.setAttribute("data-scene", scene);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta)
            meta.setAttribute(
              "content",
              dark ? "#1a0a3d" : scene === "evening" ? "#f0c393" : "#c8d8f8",
            );
        } catch (e) {
          /* stay on the static dark default */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
